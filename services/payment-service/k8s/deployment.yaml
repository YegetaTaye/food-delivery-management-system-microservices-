apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: payment-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: payment-service-secrets
              key: database-url
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: rabbitmq-url
        - name: RABBITMQ_EXCHANGE
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: rabbitmq-exchange
        - name: RABBITMQ_QUEUE
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: rabbitmq-queue
        - name: SERVICE_NAME
          value: "payment-service"
        - name: SERVICE_PORT
          value: "8003"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-consumer
  labels:
    app: payment-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-consumer
  template:
    metadata:
      labels:
        app: payment-consumer
    spec:
      containers:
      - name: payment-consumer
        image: payment-service:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.consumer"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: payment-service-secrets
              key: database-url
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: rabbitmq-url
        - name: RABBITMQ_EXCHANGE
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: rabbitmq-exchange
        - name: RABBITMQ_QUEUE
          valueFrom:
            configMapKeyRef:
              name: payment-service-config
              key: rabbitmq-queue
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
