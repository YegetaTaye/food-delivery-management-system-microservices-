version: '3.8'

services:
  payment-service:
    build: .
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@mysql:3306/payment_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_EXCHANGE=food_delivery
      - RABBITMQ_QUEUE=payment_queue
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - payment-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=payment_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - payment-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - payment-network

volumes:
  mysql-data:

networks:
  payment-network:
    driver: bridge
