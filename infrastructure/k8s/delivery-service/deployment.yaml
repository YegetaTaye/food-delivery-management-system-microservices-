apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery-service
          image: yegeta100/delivery-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3005"
            - name: SERVICE_NAME
              value: "delivery-service"
            - name: DATABASE_URL
              value: "mysql://delivery_user:delivery_password@delivery-db:3306/delivery_db"
            - name: RABBITMQ_URL
              value: "amqp://admin:admin123@rabbitmq.dev.svc.cluster.local:5672"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5
