apiVersion: v1
kind: ConfigMap
metadata:
  name: service-common-config
  namespace: dev
  labels:
    project: food-delivery-distributed-system
data:
  NODE_ENV: "development"
  RABBITMQ_URL: "amqp://admin:admin123@rabbitmq.dev.svc.cluster.local:5672"
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production-minimum-32-characters"
  JWT_EXPIRES_IN: "7d"
  JWT_REFRESH_EXPIRES_IN: "30d"
