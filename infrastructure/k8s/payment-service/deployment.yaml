apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: yegeta100/payment-service:latest
          ports:
            - containerPort: 3004
          env:
            - name: SERVICE_NAME
              value: "payment-service"

            - name: PORT
              value: "3004"

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: service-common-config
                  key: NODE_ENV

            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: service-common-config
                  key: RABBITMQ_URL

          imagePullPolicy: IfNotPresent

          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 10
            
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
