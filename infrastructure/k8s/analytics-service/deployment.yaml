apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: yegeta100/analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3007
          env:
            - name: PORT
              value: "3007"

            - name: SERVICE_NAME
              value: "analytics-service"

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: service-common-config
                  key: NODE_ENV

            - name: DATABASE_URL
              value: "mysql://analytics_user:analytics_password@analytics-db:3306/analytics_db"

            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: service-common-config
                  key: RABBITMQ_URL

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 5
